[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Lanetus/TTKServer"
readme = "README.md"
keywords = ["attestation", "ra-tls", "nitro-enclaves", "http3", "quic"]
categories = ["cryptography", "network-programming"]

[workspace.dependencies]
ttk-core = { path = "crates/core", version = "2.2.0", default-features = false }
ttk-client = { path = "crates/client", version = "2.2.0" }

aws-nitro-enclaves-nsm-api = "0.4"
axum = "0.8.9"
base64 = "0.21"
bytes = "1"
ciborium = "0.2"
der-parser = "10.0.0"
env_logger = "0.11"
h3 = "0.0.7"  # The core HTTP/3 state machine
h3-quinn = "0.0.9"  # The adapter bridging Quinn's QUIC API to h3's Transport trait
# RFC 9180 HPKE (DHKEM(P-256)) sealing `/faf` relay addresses and message keys to a node's RA-TLS key.
hpke = { version = "0.12", default-features = false, features = ["alloc", "p256"] }
log = "0.4"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
quinn = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rustls-webpki = "0.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3.36"
tokio = { version = "1", features = ["full"] }
tokio-vsock = "0.3"
tower-service = "0.3"
x509-parser = { version = "0.18.1", features = ["verify"] }
criterion = "0.8.2"
