[graph]
# Replaced 'all-targets = true' with targets list
targets = [
    { triple = "x86_64-unknown-linux-musl" },
]

[advisories]
vulnerability = "deny"
# Changed from "warn" to enum string
unmaintained = "all"
notice = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []