[advisories]
vulnerability = "deny"
unmaintained = "all"

[licenses]
# Reject viral copyleft licenses like GPL
allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]

[bans]
# Disallow duplicate versions of heavy crates
multiple-versions = "deny"
# Explicitly block specific known bad crates
deny = [
    { name = "openssl" } # Force team to use rustls
]

[sources]
# Reject crates installed directly from unverified git branches
unknown-registry = "deny"
unknown-git = "deny"