[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
]

[advisories]
# Moved severity levels into [advisories.lints] or advisory-specific settings
unmaintained = "all"
yanked = "deny"
ignore = []

[advisories.lints]
vulnerability = "deny"
notice = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.lints]
unlicensed = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []