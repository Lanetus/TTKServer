[graph]
targets = []
all-targets = true

# Check for security advisories (via RustSec)
[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
ignore = [
    # "RUSTSEC-0000-0000", # Example: Ignore specific advisory ID if needed
]

# Check license compliance across dependencies
[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# Restrict duplicate dependencies or forbid specific crates
[bans]
multiple-versions = "warn" # Flag duplicate crate versions in dependency tree
wildcards = "deny"         # Forbid wildcard dependencies (e.g. "*")
highlight = "all"
deny = [
    # { name = "openssl" }, # Example: Forbid specific crates
]
skip = [
    # { name = "either", version = "1.5.0" }, # Allow specific older duplicate versions
]

# Ensure dependencies come only from trusted registries
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []