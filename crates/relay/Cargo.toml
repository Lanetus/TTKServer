[package]
name = "ttk-relay"
description = "TTKServer relay node: an attested enclave server forwarding onion-routed /faf requests, plus the parent-instance vsock proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_relay"

# The relay node, run inside the enclave.
[[bin]]
name = "relay"
path = "src/main.rs"

# Parent-instance daemon relaying QUIC between public UDP and the enclave's vsock, both ways. Linux only.
[[bin]]
name = "vsock-proxy"
path = "src/bin/vsock-proxy.rs"

[dependencies]
ttk-core.workspace = true
ttk-client.workspace = true
axum.workspace = true
env_logger.workspace = true
log.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bytes.workspace = true
tokio-vsock.workspace = true

[features]
default = ["nitro", "mock"]

nitro = ["ttk-core/nitro"]
mock = ["ttk-core/mock"]
sev-snp = ["ttk-core/sev-snp"]
tdx = ["ttk-core/tdx"]

[dev-dependencies]
ttk-core = { workspace = true, features = ["mock"] }
ttk-terminal = { path = "../terminal" }
serde_json.workspace = true
