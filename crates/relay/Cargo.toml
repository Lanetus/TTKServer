[package]
name = "ttk-relay"
description = "TTKServer relay node: an attested enclave server forwarding onion-routed /faf requests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_relay"

[dependencies]
ttk-ra-server.workspace = true
ttk-ra-client.workspace = true
axum.workspace = true
log.workspace = true
ring.workspace = true
tokio.workspace = true

[features]
default = ["nitro", "mock"]

nitro = ["ttk-ra-server/nitro"]
mock = ["ttk-ra-server/mock"]
sev-snp = ["ttk-ra-server/sev-snp"]
tdx = ["ttk-ra-server/tdx"]

[dev-dependencies]
ttk-ra-server = { workspace = true, features = ["mock"] }
ttk-storage.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `ttk-ra-server/tests/support/test_ca.rs` (`sign_for_tests`).
rcgen.workspace = true
rustls.workspace = true
x509-parser.workspace = true
