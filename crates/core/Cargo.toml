[package]
name = "ttk-core"
description = "TTKServer core: the EAT data model, RA-TLS constants, egress policy and vsock transport shared by the attested server and its client, plus the parent-instance vsock proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_core"

# Parent-instance daemon relaying QUIC between public UDP and the enclave's vsock, both ways. Linux only.
[[bin]]
name = "vsock-proxy"
path = "src/bin/vsock-proxy.rs"

[dependencies]
ciborium.workspace = true
env_logger.workspace = true
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bytes.workspace = true
quinn.workspace = true
tokio.workspace = true
tokio-vsock.workspace = true
