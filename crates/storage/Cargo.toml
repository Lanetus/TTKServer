[package]
name = "ttk-storage"
description = "TTKServer storage for the terminal node: the file service evaluator and its blob stores (in memory, S3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_storage"

[dependencies]
ttk-core.workspace = true
ttk-ra-server.workspace = true
ciborium.workspace = true
log.workspace = true
sha2.workspace = true
tokio.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }

[features]
default = ["nitro", "mock"]

nitro = ["ttk-ra-server/nitro"]
mock = ["ttk-ra-server/mock"]
sev-snp = ["ttk-ra-server/sev-snp"]
tdx = ["ttk-ra-server/tdx"]
# `adaptors::s3::S3Store`, used by the `s3-server` bin in `ttk-executables`.
s3 = [
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
]

[dev-dependencies]
axum.workspace = true
ttk-ra-server = { workspace = true, features = ["mock"] }
ttk-ra-client = { workspace = true }
rcgen.workspace = true
# `ttk-ra-server/tests/support/test_ca.rs` (`sign_for_tests`).
rustls.workspace = true
x509-parser.workspace = true
