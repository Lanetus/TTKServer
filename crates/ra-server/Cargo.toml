[package]
name = "ttk-ra-server"
description = "RA-TLS HTTP/3 (QUIC) attested server library for TEEs (AWS Nitro, AMD SEV-SNP, Intel TDX) with RFC 9711 EAT evidence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_ra_server"

[dependencies]
ttk-core.workspace = true
aws-nitro-enclaves-nsm-api = { workspace = true, optional = true }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
ciborium.workspace = true
h3.workspace = true
h3-quinn.workspace = true
log.workspace = true
quinn.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tower-service.workspace = true
x509-parser.workspace = true

[features]
default = ["nitro", "mock"]

nitro = ["dep:aws-nitro-enclaves-nsm-api"]
mock = ["dep:aws-nitro-enclaves-nsm-api"]
sev-snp = []
tdx = []
