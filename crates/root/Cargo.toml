[package]
name = "ttk-root"
description = "TTKServer root node: an attested enclave server that publishes the checksums of the accepted enclave images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_root"

[dependencies]
ttk-ra-server.workspace = true
ttk-ra-client.workspace = true
ttk-core.workspace = true
axum.workspace = true
base64 = { workspace = true, optional = false }
log = { workspace = true, optional = false }
rand_core = { workspace = true, optional = false }
rcgen = { workspace = true, optional = false }
rustls-pki-types = { workspace = true, optional = false }
sha2 = { workspace = true, optional = false }
time = { workspace = true, optional = false }
x509-parser = { workspace = true, optional = false }

[features]
default = ["nitro", "mock"]

nitro = ["ttk-ra-server/nitro"]
mock = ["ttk-ra-server/mock"]
sev-snp = ["ttk-ra-server/sev-snp"]
tdx = ["ttk-ra-server/tdx"]

[dev-dependencies]
tokio.workspace = true
rcgen.workspace = true
sha2.workspace = true
ttk-ra-server = { workspace = true, features = ["mock"] }
bytes.workspace = true
h3.workspace = true
h3-quinn.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
# `ttk-ra-server/tests/support/test_ca.rs` (`sign_for_tests`).
x509-parser.workspace = true
