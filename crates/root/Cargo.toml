[package]
name = "ttk-root"
description = "TTKServer root node: an attested enclave server that publishes the checksums of the accepted enclave images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_root"

# The root node, run inside the enclave.
[[bin]]
name = "root"
path = "src/main.rs"

# Test CA client: attests a node, checks fresh Evidence (`POST /evidence`) and installs a
# certificate it issues for the node's RA-TLS key (`POST /certificate`). Never in enclave images.
[[bin]]
name = "auth-test"
path = "src/bin/auth-test.rs"
required-features = ["auth-test"]

[dependencies]
ttk-ra-server.workspace = true
ttk-core.workspace = true
axum.workspace = true
env_logger.workspace = true
tokio.workspace = true
# `auth` module and the `auth-test` bin only.
base64 = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
time = { workspace = true, optional = true }
ttk-ra-client = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }

[features]
default = ["nitro", "mock"]

nitro = ["ttk-ra-server/nitro"]
mock = ["ttk-ra-server/mock"]
sev-snp = ["ttk-ra-server/sev-snp"]
tdx = ["ttk-ra-server/tdx"]
# The `auth` module (test certificate authority) and the `auth-test` bin.
auth-test = [
    "dep:base64",
    "dep:log",
    "dep:rand_core",
    "dep:rcgen",
    "dep:rustls-pki-types",
    "dep:time",
    "dep:ttk-ra-client",
    "dep:x509-parser",
]

[dev-dependencies]
rcgen.workspace = true
ttk-ra-server = { workspace = true, features = ["mock"] }
bytes.workspace = true
h3.workspace = true
h3-quinn.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
