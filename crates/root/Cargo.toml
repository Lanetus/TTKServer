[package]
name = "ttk-root"
description = "TTKServer root node: an attested enclave server that publishes the checksums of the accepted enclave images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_root"

# The root node, run inside the enclave.
[[bin]]
name = "root"
path = "src/main.rs"

[dependencies]
ttk-ra-server.workspace = true
ttk-ra-client.workspace = true
axum.workspace = true
env_logger.workspace = true
serde.workspace = true
tokio.workspace = true

[features]
default = ["nitro", "mock"]

nitro = ["ttk-ra-server/nitro"]
mock = ["ttk-ra-server/mock"]
sev-snp = ["ttk-ra-server/sev-snp"]
tdx = ["ttk-ra-server/tdx"]

[dev-dependencies]
ttk-ra-server = { workspace = true, features = ["mock"] }
bytes.workspace = true
h3.workspace = true
h3-quinn.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
