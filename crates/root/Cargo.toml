[package]
name = "ttk-root"
description = "TTKServer root node: an attested enclave server that publishes the checksums of the accepted enclave images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "ttk_root"

[dependencies]
ttk-ra-server.workspace = true
ttk-core.workspace = true
axum.workspace = true
# `auth` module only.
base64 = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
time = { workspace = true, optional = true }
ttk-ra-client = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }

[features]
default = ["nitro", "mock"]

nitro = ["ttk-ra-server/nitro"]
mock = ["ttk-ra-server/mock"]
sev-snp = ["ttk-ra-server/sev-snp"]
tdx = ["ttk-ra-server/tdx"]
# The `auth` module (test certificate authority), used by the `auth-test` bin in `ttk-executables`.
auth-test = [
    "dep:base64",
    "dep:log",
    "dep:rand_core",
    "dep:rcgen",
    "dep:rustls-pki-types",
    "dep:sha2",
    "dep:time",
    "dep:ttk-ra-client",
    "dep:x509-parser",
]

[dev-dependencies]
tokio.workspace = true
rcgen.workspace = true
sha2.workspace = true
ttk-ra-server = { workspace = true, features = ["mock"] }
bytes.workspace = true
h3.workspace = true
h3-quinn.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
# `ttk-ra-server/tests/support/test_ca.rs` (`sign_for_tests`).
x509-parser.workspace = true
