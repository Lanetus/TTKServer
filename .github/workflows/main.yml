name: CD

on:
  push:
    branches: [ "main" ]

env:
  ECR_REGISTRY: 103680339861.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: ra-server
  IMAGE_TAG: latest
  CARGO_TERM_COLOR: always

jobs:
  bump_version:
    name: Bump version
    runs-on: ubuntu-latest
    # This condition prevents the workflow from running on its own commits
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LANETUS_APP_ID }}
          private-key: ${{ secrets.LANETUS_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine bump level
        id: bump_level
        run: |
          commit_message="${{ github.event.head_commit.message }}"
          if [[ "$commit_message" == major:* ]]; then
            echo "level=major" >> $GITHUB_OUTPUT
          elif [[ "$commit_message" == feat:* ]]; then
            echo "level=minor" >> $GITHUB_OUTPUT
          elif [[ "$commit_message" == fix:* ]]; then
            echo "level=patch" >> $GITHUB_OUTPUT
          else
            echo "level=patch" >> $GITHUB_OUTPUT
          fi

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Bump version
        run: cargo set-version --bump ${{ steps.bump_level.outputs.level }}

      - name: Get new version
        id: version
        run: echo "tag=$(cargo pkgid | sed 's/.*#//')" >> $GITHUB_OUTPUT

      - name: Commit version bump and create tag
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(release): version ${{ steps.version.outputs.tag }}"
          tagging_message: "v${{ steps.version.outputs.tag }}"

  build:
    name: Build (${{ matrix.arch }})
    needs: bump_version
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: "v${{ needs.bump_version.outputs.new_tag }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per-arch image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:v${{ needs.bump_version.outputs.new_tag }}
  

  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    needs: bump_version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Runs the tests once: writes coverage to lcov.info and results to target/nextest/ci/junit.xml
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --all-features --workspace --profile ci --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }} # Required for private repos & recommended for public repos

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: target/nextest/ci/junit.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
