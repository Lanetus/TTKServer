name: Release

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  ECR_REGISTRY: 103680339861.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: ra-server
  IMAGE_TAG: latest

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Runs the tests once: writes coverage to lcov.info and results to target/nextest/ci/junit.xml
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --all-features --workspace --profile ci --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }} # Required for private repos & recommended for public repos

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: target/nextest/ci/junit.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pages: write     # to deploy to GitHub Pages
      id-token: write  # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let an in-progress deployment finish instead of cancelling it
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # mdbook-mermaid renders ```mermaid blocks (flowcharts etc.); config in docs/book.toml
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid

      # Writes the book to docs/book (default build dir next to docs/src)
      - name: Build mdBook
        run: mdbook build docs

      # Clear docs restored by the cargo cache so only the workspace crates' API is published
      - name: Build Rust API docs
        run: |
          rm -rf target/doc
          cargo doc --workspace --no-deps --lib --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # Served under the book at api/, linked from the "API Reference" chapter (docs/src/api.md)
      - name: Copy API docs into the book
        run: |
          rm -rf docs/book/api
          cp -r target/doc docs/book/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-and-publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

      # Production build: the enclave nodes and the parent's vsock-proxy, not the test-only `client`.
      - name: Build release
        run: cargo build --release --locked -p ttk-executables --bin relay --bin root --bin vsock-proxy --bin vsock-proxy-tcp

      - name: Upload node binaries
        uses: actions/upload-artifact@v4
        with:
          name: TTKServer-${{ github.sha }}
          path: |
            target/release/relay
            target/release/root
            target/release/vsock-proxy
          if-no-files-found: error

      # Packages the crates and verifies that they build from the packaged sources.
      - name: Package crates
        run: cargo package --workspace --locked

      - name: Publish to crates.io
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

  build:
    name: Build (${{ matrix.node }}, ${{ matrix.arch }}) eif and docker image
    needs: test
    strategy:
      matrix:
        node: [ relay, root ]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get new version
        id: version
        run: echo "tag=$(cargo pkgid -p ttk-ra-server | sed 's/.*[#@]//')" >> $GITHUB_OUTPUT

      - name: Build and push per-arch image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: NODE=${{ matrix.node }}
          cache-from: type=gha,scope=${{ matrix.node }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.node }}-${{ matrix.arch }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.node }}-${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.node }}-v${{ steps.version.outputs.tag }}

      # Same reproducible build as locally (pinned base images, Debian snapshot and nitro-cli,
      # SOURCE_DATE_EPOCH = commit time): the PCR0 can be reproduced from the tagged commit.
      # Never a debug image: its PCR0 must not reach an allowlist.
      - name: Build EIF
        env:
          TTK_DEBUG: "0"
        run: |
          scripts/build-eif.sh ${{ matrix.arch }} ${{ matrix.node }}
          test -f out/ttk-${{ matrix.node }}_v${{ steps.version.outputs.tag }}_${{ matrix.arch }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: ttk-${{ matrix.node }}_v${{ steps.version.outputs.tag }}_${{ matrix.arch }}
          path: out/
